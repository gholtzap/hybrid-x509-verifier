[package]
name = "hybrid-x509-evidence"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Policy evaluator for classical and post-quantum X.509 authentication evidence"

[lib]
name = "hybrid_x509_evidence"
path = "src/lib.rs"

[[bin]]
name = "hybrid-x509-evaluate"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
der = { version = "0.7", features = ["pem", "std"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sha1 = "0.11"
thiserror = "2.0"
tempfile = "3.23"
wait-timeout = "0.2"
x509-parser = { version = "0.18.1", features = ["verify"] }
x509-ocsp = { version = "0.2.1", features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
