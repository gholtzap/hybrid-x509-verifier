name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  portable-oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked --test oracle
      - if: runner.os == 'Linux'
        run: scripts/reproducible-build-check.sh
      - if: runner.os == 'Linux'
        run: scripts/reproducible-image-check.sh

  linux-adapters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y gnutls-bin jq
      - run: |
          for build in tools/*-x509-adapter/build.sh; do
            "$build"
          done
      - run: tools/corpus-generator/generate.sh
      - run: cargo test --locked --all-features
      - run: scripts/dependency-check.sh
      - run: scripts/generate-sbom.sh
      - run: git diff --exit-code -- sbom-rust.cdx.json sbom-all.cdx.json
